name: Mattisson Feed Updater

on:
  schedule:
    # 2x per dag (06:00 en 18:00 UTC) voor prijs + beschikbaarheid.
    - cron: "0 5,17 * * *"
  workflow_dispatch:

# De bot moet de bijgewerkte XML kunnen terugpushen naar de repo.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies installeren
        run: pip install -r requirements.txt
      - name: Scraper draaien
        run: python scraper.py
      - name: XML committen en pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mattisson_feed.xml
          git diff --staged --quiet || git commit -m "🔄 Feed bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
